  <text x="280" y="255" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="46" font-weight="900" fill="#102D46" letter-spacing="-0.02em">机场智选</text>
