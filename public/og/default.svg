  <circle cx="218" cy="253" r="24" stroke="#10B89A" stroke-width="3" stroke-dasharray="5 5" opacity="0.7"/>
  <path d="M204 254L214 264L232 242" stroke="#10B89A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
